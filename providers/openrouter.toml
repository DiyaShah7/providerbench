# OpenRouter routes to many providers behind one key. Useful as a baseline; pin a single upstream
# with extra_body provider.order if you want a like-for-like comparison.
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
key_env = "OPENROUTER_API_KEY"
docs = "https://openrouter.ai/docs"

[models]
"glm-5.3-flash" = "z-ai/glm-5.3-flash"
"deepseek-v4.1-flash" = "deepseek/deepseek-v4.1-flash-1017"
"gemma-4-31b" = "google/gemma-4-31b-it"
"glm-5.3" = "z-ai/glm-5.3"
"kimi-k3.1-pro" = "moonshotai/kimi-k3.1-pro"
"kimi-k3" = "moonshotai/kimi-k3"
"deepseek-v4-pro" = "deepseek/deepseek-v4-pro"
"qwen-3.8-27b" = "qwen/qwen3.8-27b"
"mimo-v2.6-flash" = "xiaomi/mimo-v2.6-flash"
"mimo-v2.6-pro" = "xiaomi/mimo-v2.6-pro"

[thinking_off]
"*" = { reasoning = { enabled = false } }

[[pricing]]
source = "models_endpoint"
public = true                          # /models is readable without a key

[[pricing]]
source = "manual"
